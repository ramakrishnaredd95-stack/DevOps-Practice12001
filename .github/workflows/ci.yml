name: Boutique CI Pipeline (Feature Branch)

on:
  push:
    branches:
      - 'feature/*'
  workflow_dispatch:

env:
  AZURE_REGISTRY: ${{ secrets.AZURE_REGISTRY_URL }}
  REGISTRY_USERNAME: ${{ secrets.AZURE_REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.AZURE_REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && 'projects/boutique-microservices/frontend' || format('projects/boutique-microservices/backend/services/{0}', matrix.service) }}
          push: true
          tags: ${{ env.AZURE_REGISTRY }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.AZURE_REGISTRY }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.AZURE_REGISTRY }}/${{ matrix.service }}:buildcache,mode=max

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in k8s manifests
        run: |
          NEW_TAG=${{ github.sha }}
          REGISTRY=${{ env.AZURE_REGISTRY }}

          for SERVICE in auth gateway orders order-service product-service user-service; do
            MANIFEST="gitops/k8s/backend/${SERVICE}.yml"
            if [ -f "$MANIFEST" ]; then
              sed -i "s|\(${REGISTRY}/${SERVICE}:\).*|\1${NEW_TAG}|g" $MANIFEST
            fi
          done

          FRONTEND_MANIFEST="gitops/k8s/frontend/deployment.yml"
          if [ -f "$FRONTEND_MANIFEST" ]; then
            sed -i "s|\(${REGISTRY}/frontend:\).*|\1${NEW_TAG}|g" $FRONTEND_MANIFEST
          fi

      - name: Commit and push updated manifests to feature branch
        run: |
          git config user.name "github-actions"
          

          
          git config user.email "github-actions@github.com"

          BRANCH_NAME=${GITHUB_REF#refs/heads/}

          git add gitops/k8s/

          if ! git diff --staged --quiet; then
            git commit -m "ci(feature): update image tags to ${{ github.sha }}"
            git push origin $BRANCH_NAME
          else
            echo "No changes to commit"
          fi