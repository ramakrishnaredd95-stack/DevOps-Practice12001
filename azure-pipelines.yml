trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  # Create this Docker Registry service connection in Azure DevOps.
  acrServiceConnection: boutique-acr
  azureRegistryLoginServer: boutiqueacr.azurecr.io
  imageTag: $(Build.SourceVersion)

stages:
  - stage: Build
    displayName: Build and push images
    jobs:
      - job: BuildImages
        displayName: Build service images
        pool:
          vmImage: ubuntu-latest
        strategy:
          matrix:
            auth:
              serviceName: auth
              dockerContext: projects/boutique-microservices/backend/services/auth
            gateway:
              serviceName: gateway
              dockerContext: projects/boutique-microservices/backend/services/gateway
            orders:
              serviceName: orders
              dockerContext: projects/boutique-microservices/backend/services/orders
            order_service:
              serviceName: order-service
              dockerContext: projects/boutique-microservices/backend/services/order-service
            product_service:
              serviceName: product-service
              dockerContext: projects/boutique-microservices/backend/services/product-service
            user_service:
              serviceName: user-service
              dockerContext: projects/boutique-microservices/backend/services/user-service
            frontend:
              serviceName: frontend
              dockerContext: projects/boutique-microservices/frontend
        steps:
          - checkout: self

          - task: Docker@2
            displayName: Build and push $(serviceName)
            inputs:
              command: buildAndPush
              containerRegistry: $(acrServiceConnection)
              repository: $(serviceName)
              Dockerfile: $(dockerContext)/Dockerfile
              buildContext: $(dockerContext)
              tags: |
                $(imageTag)

  - stage: UpdateManifests
    displayName: Update GitOps image tags
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: CommitManifests
        displayName: Commit updated manifests
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              set -euo pipefail

              for service in auth gateway orders order-service product-service user-service; do
                manifest="gitops/k8s/backend/${service}.yml"
                sed -i -E "s|image: .*\/${service}:.*|image: $(azureRegistryLoginServer)/${service}:$(imageTag)|g" "$manifest"
              done

              sed -i -E "s|image: .*\/frontend:.*|image: $(azureRegistryLoginServer)/frontend:$(imageTag)|g" gitops/k8s/frontend/deployment.yml
            displayName: Update manifest image tags

          - script: |
              set -euo pipefail

              git config user.name "azure-pipelines"
              git config user.email "azure-pipelines@local"
              git add gitops/k8s/
              git diff --staged --quiet || git commit -m "ci: update image tags to $(Build.SourceVersion)"
              git push origin HEAD:main
            displayName: Commit and push manifests
